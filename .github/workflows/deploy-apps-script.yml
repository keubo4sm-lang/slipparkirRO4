name: Deploy Apps Script

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure clasp credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          test -n "$CLASPRC_JSON"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          node -e "const fs=require('fs'); const c=JSON.parse(fs.readFileSync(process.env.HOME+'/.clasprc.json','utf8')); if (!c.access_token && !c.token && !c.tokens) throw new Error('CLASPRC_JSON tidak berisi credential clasp yang valid');"

      - name: Push to Google Apps Script
        run: npx --yes @google/clasp@3.4.1 push --force

      - name: Redeploy Web App
        env:
          DEPLOYMENT_ID: ${{ secrets.DEPLOYMENT_ID }}
        run: |
          test -n "$DEPLOYMENT_ID"
          npx --yes @google/clasp@3.4.1 deploy --deploymentId "$DEPLOYMENT_ID" --description "GitHub $GITHUB_SHA"
